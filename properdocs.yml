site_name: Federico Thiella | Data Engineer

theme:
  name: materialx
  icon:
    logo: material/triangle
  palette:
    - scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Passa al tema scuro
    - scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Passa al tema chiaro
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - blog:
      blog_dir: blog
      post_date_format: "dd MMMM yyyy"
      pagination_per_page: 10
      archive_name: "Archivio"
      categories_name: "Categorie"

nav:
  - Blog:
      - blog/index.md
  - About: about.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      use_pygments: true
      pygments_style: monokai
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js